name: Build Draft Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_patterns: |
              frontend/src-tauri/target/release/bundle/msi/*.msi
              frontend/src-tauri/target/release/bundle/setup/*.exe
          - os: macos-latest
            target: macos
            artifact_patterns: |
              frontend/src-tauri/target/release/bundle/dmg/*.dmg
              frontend/src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies (Ubuntu skipped for now, but we use macOS/Windows)
        working-directory: ./frontend
        run: |
          npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Windows app
        if: matrix.target == 'windows'
        working-directory: ./frontend
        run: npm run tauri build
        env:
          TAURI_BUILD: true

      - name: Build macOS app
        if: matrix.target == 'macos'
        working-directory: ./frontend
        run: npm run tauri build

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_patterns }}
          draft: true
          name: "Draft Release ${{ github.sha }}"
          tag_name: "draft-${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}