services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-users_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-admin}
    volumes:
      - "./data/postgres/postgres_data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 1s

  messagebase:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}
    volumes:
      - "./data/mongo/mongo_data:/data/db"
  app:
    build: .
    volumes:
      - ./logs:/app/backend/logs
    ports:
      - "80:80"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data: